name: Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        # A lockfile cannot be generated in the isolated/offline editing environment.
        # Once committed, switch this step to `npm ci` and enable setup-node's npm cache.
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run regression tests
        run: npm test
      - name: Build production bundle
        run: npm run build
